const container = document.getElementById('listContainer');
const blocks = rawText.trim().split(/\n\s*\n/);

blocks.forEach((block, idx) => {
  const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
  const title = lines[0];
  const section = document.createElement('section');
  section.className = 'category';
  section.id = `cat-${idx + 1}`;

  const h2 = document.createElement('h2');
  h2.textContent = title;
  section.appendChild(h2);

  const grid = document.createElement('div');
  grid.className = 'grid';

  for (let i = 1; i < lines.length; i++) {
    const line = lines[i];
    const match = line.match(/^(\d+)\.\s*(.+)$/);
    if (!match) continue;
    const num = match[1];
    let rest = match[2];

    let deceasedBadge = '';
    const decMatch = rest.match(/（故人・[^）]+）$/);
    if (decMatch) {
      deceasedBadge = decMatch[0].replace(/[（）]/g, '');
      rest = rest.replace(/（故人・[^）]+）$/, '');
    }

    const firstParenIdx = rest.indexOf('（');
    let name = rest;
    let desc = '';
    if (firstParenIdx !== -1) {
      const secondParenIdx = rest.indexOf('）（');
      if (secondParenIdx !== -1) {
        name = rest.slice(0, secondParenIdx + 1);
        desc = rest.slice(secondParenIdx + 2, -1);
      } else {
        name = rest.slice(0, firstParenIdx);
        desc = rest.slice(firstParenIdx + 1, -1);
      }
    }

    let noteText = '';
    const noteMatch = desc.match(/※[^）]+/);
    if (noteMatch) {
      noteText = noteMatch[0];
      desc = desc.replace(noteText, '').trim();
    }

    const nat = nationalities[Number(num)] || "";

    const card = document.createElement('article');
    card.className = 'card';
    card.dataset.search = `${num} ${name} ${nat} ${desc} ${deceasedBadge} ${noteText} ${title}`.toLowerCase();

    card.innerHTML = `
      <div class="num">${num}</div>
      <div class="info">
        <div class="name-row">
          <span class="name">${name}</span>
          ${nat ? `<span class="nat-badge">${nat}</span>` : ''}
          ${deceasedBadge ? `<span class="deceased">${deceasedBadge}</span>` : ''}
        </div>
        <div class="desc">${desc}</div>
        ${noteText ? `<div class="note">${noteText}</div>` : ''}
      </div>
    `;
    grid.appendChild(card);
  }

  section.appendChild(grid);
  container.appendChild(section);
});

const searchInput = document.getElementById('searchInput');
const countDisplay = document.getElementById('countDisplay');
const allCards = Array.from(document.querySelectorAll('.card'));
const allSections = Array.from(document.querySelectorAll('section.category'));

searchInput.addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  let visibleCount = 0;

  allCards.forEach(card => {
    const match = !q || card.dataset.search.includes(q);
    card.classList.toggle('hidden', !match);
    if (match) visibleCount++;
  });

  allSections.forEach(sec => {
    const hasVisible = sec.querySelectorAll('.card:not(.hidden)').length > 0;
    sec.classList.toggle('hidden', !hasVisible);
  });

  countDisplay.textContent = `表示中: ${visibleCount} / ${allCards.length}人`;
});
</script>
