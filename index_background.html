<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>背景演出</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">

  <!--==============particles.js 背景演出のCSSを読み込み===============-->
  <link rel="stylesheet" type="text/css" href="css/5-9.css">

  <style>
    html, body {
      height: 100% !important;
      margin: 0;
      padding: 0;
      overflow: hidden !important;
    }

    #particles-js {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 0 !important;
    }

    /* BGM再生トグルボタン */
    #bgm-toggle {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(127, 216, 255, 0.4);
      background: rgba(2, 14, 52, 0.7);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #bgm-toggle:hover {
      background: rgba(79, 124, 255, 0.4);
    }
    #bgm-toggle.bgm-needs-tap {
      animation: bgmPulse 1.6s ease-in-out infinite;
    }
    @keyframes bgmPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(127, 216, 255, 0.5); }
      50% { box-shadow: 0 0 0 8px rgba(127, 216, 255, 0); }
    }

    /* html/bodyには触らず、専用の背景レイヤーを一枚敷く */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-color: #020E34;
      z-index: -2;
    }
  </style>
</head>
<body>

  <!--==============particles.js を描画する背景エリア===============-->
  <div id="particles-js"></div>

  <!--==============particles.js 本体ライブラリ（サイト内に同梱）===============-->
  <script src="js/particles.js"></script>
  <!--==============particles.js の設定（週番号で自動ローテーション）===============-->
  <!--==============花火エフェクト（背景ローテーションより先に読み込む）===============-->
  <script src="js/fireworks.js"></script>
  <script src="js/background-rotator.js"></script>
  <!--==============BGM再生用===============-->
  <audio id="bgm-player" preload="auto"></audio>
  <button id="bgm-toggle" aria-label="音楽を再生/停止" aria-pressed="false">🔈</button>
  <script src="js/bgm-rotator.js"></script>

</body>
</html>
