<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>いしちゃんのホームページ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* --- 基本リセット & 共通設定 --- */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: linear-gradient(#eef6ff, #ffffff);
      background-attachment: fixed;
      color: #1a1a2e;
      padding: 40px 20px 60px;
      min-height: 100vh;
    }

    /* --- 印刷ボタン --- */
    .print-bar {
      max-width: 750px;
      margin: 0 auto 15px auto;
      text-align: right;
    }

    .print-button {
      padding: 8px 20px;
      background-color: #0057b8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .print-button:hover {
      background-color: #003d82;
    }

    /* --- ヘッダー --- */
    header {
      text-align: center;
      margin: 0 auto 30px auto;
      max-width: 750px;
      background: linear-gradient(135deg, #0b5cab, #5aa9ff);
      color: #ffffff;
      border-radius: 16px;
      padding: 30px 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    header .title-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    header .profile-icon {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.4);
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    header p {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.9);
      margin: 4px 0;
      line-height: 1.5;
    }

    /* --- グリッド & 行（カード）レイアウト --- */
    .grid {
      max-width: 750px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 各カテゴリのカード */
    .row {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      padding: 24px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 24px;
    }

    /* 左側：カテゴリラベル */
    .category-label {
      width: 180px;
      min-width: 180px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #003366;
      text-align: left;
      border-left: 6px solid #2f73c7;
      padding-left: 12px;
      display: flex;
      align-items: center;
    }

    /* 右側：ボタンエリア（PCでは横並び、スマホでは縦並びを制御） */
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      flex: 1;
    }

    /* --- ボタンの共通スタイル --- */
    a.button {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 150px;
      min-height: 54px;
      padding: 6px 12px;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      line-height: 1.3;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
      border: 1px solid rgba(255,255,255,0.15);
      background-image: linear-gradient(180deg, rgba(255,255,255,0.15), rgba(0,0,0,0.05));
    }

    /* ホバー時の動き */
    a.button:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 6px 14px rgba(0,0,0,0.18);
    }

    /* --- カラーバリエーション --- */
    a.button { background-color: #0044cc; }
    a.button:hover { background-color: #0033a3; }

    a.button.green { background-color: #00b050; }
    a.button.green:hover { background-color: #00813b; }

    a.button.brown { background-color: #7b3614; }
    a.button.brown:hover { background-color: #5c2710; }

    a.button.olive { background-color: #808000; }
    a.button.olive:hover { background-color: #616100; }

    a.button.pink { background-color: #e60073; }
    a.button.pink:hover { background-color: #b30059; }

    /* --- レスポンシブ対応（スマホ表示） --- */
    @media (max-width: 600px) {
      body {
        padding: 20px 12px;
      }
      
      .row {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        padding: 20px;
      }

      .category-label {
        width: 100%;
        min-width: auto;
        padding-bottom: 4px;
        border-left: 4px solid #2f73c7;
      }

      .buttons {
        width: 100%;
        flex-direction: column; /* ★スマホ時はボタンエリアを上から下への縦並びに変更 */
        gap: 12px;
      }

      /* ボタンの横幅をスマホ向けに完全に最適化 */
      a.button {
        width: 100% !important; /* ★すべてのボタンの横幅を100%に固定して統一 */
        font-size: 0.9rem;
        min-height: 52px;
        height: auto;
      }
    }
  </style>
</head>
