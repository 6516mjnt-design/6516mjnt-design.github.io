<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量子生物学</title>
    <style>
        /* パターンB: 画面全体を薄いグレーに設定 */
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* パターンB: 背景を透明（transparent）にし、枠線や影を完全に排除 */
        .slide-container {
            background-color: transparent;
            border: none;
            box-shadow: none;
            width: 100%;
            max-width: 1200px;
            padding: 40px;
            box-sizing: border-box;
        }
        /* 表題：中央配置 */
        .main-title {
            font-size: 28px;
            color: #333333;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
        }
        /* 横並びの行（タイトルと4つのボタン） */
        .content-row {
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 25px;
        }
        /* 左側の見出しラベル */
        .row-label {
            font-size: 20px;
            font-weight: bold;
            color: #333333;
            flex: 1; /* ラベルエリアの幅の比率 */
            padding-right: 20px;
            border-right: 3px solid #333333;
            margin-right: 30px;
            text-align: right;
            white-space: nowrap;
        }
        /* 4つのボタンのラッパー */
        .button-group {
            display: flex;
            gap: 15px;
            flex: 4; /* ボタンエリア全体の幅の比率 */
        }
        /* ボタンの共通スタイル */
        .btn {
            flex: 1; /* 4つのボタンを均等幅にする */
            display: block;\r
            padding: 20px 10px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            box-sizing: border-box;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
            white-space: nowrap;
        }
        .btn:hover {
            opacity: 0.9;
        }
        /* 青色のリンクボタン */
        .btn-blue {
            background-color: #003399;
            color: #ffffff;
        }
        /* グレーのボタン */
        .btn-gray {
            background-color: #9ea1a6;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="slide-container">
    <div class="main-title">量子生物学</div>
    
    <div class="content-row">
        <div class="row-label">光合成</div>
        <div class="button-group">
            <a href="Quantum_biology_photosynthesis.html" class="btn btn-blue">量子生物学と光合成</a>
            <a href="Plants_and_animals.html" class="btn btn-blue">植物と動物の進化とDNA</a>
            <button class="btn btn-gray" disabled>ーーー</button>
            <button class="btn btn-gray" disabled>ーーー</button>
        </div>
    </div>

    <div class="content-row">
        <div class="row-label">ーーー</div>
        <div class="button-group">
            <button class="btn btn-gray" disabled>ーーー</button>
            <button class="btn btn-gray" disabled>ーーー</button>
            <button class="btn btn-gray" disabled>ーーー</button>
            <button class="btn btn-gray" disabled>ーーー</button>
        </div>
    </div>

</body>
</html>
