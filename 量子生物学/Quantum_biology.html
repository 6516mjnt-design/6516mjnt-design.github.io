<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量子生物学</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        /* パワポのスライド幅を意識した横長のコンテナ */
        .slide-container {
            background-color: #ffffff;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 1200px;
            padding: 40px;
            box-sizing: border-box;
        }
        /* 表題：中央配置 */
        .main-title {
            font-size: 28px;
            color: #333333;
            font-weight: bold;
            text-align: center;
            margin-bottom: 40px;
        }
        /* テキストとボタンを横一列に並べるコンテナ */
        .content-row {
            display: flex;
            align-items: center; /* 縦方向の中央揃え */
            gap: 20px; /* 要素同士の間隔 */
            width: 100%;
        }
        /* 左側に配置する「光合成」テキストのスタイル */
        .side-text {
            font-size: 20px;
            font-weight: bold;
            color: #333333;
            flex: 1; /* テキストエリアの幅 */
            white-space: nowrap;
            text-align: right; /* ボタンに寄せるために右寄せ */
            padding-right: 10px;
        }
        /* 4つのボタンのラッパー */
        .button-group {
            display: flex;
            gap: 15px;
            flex: 4; /* ボタンエリア全体の幅の比率 */
        }
        /* ボタンの共通スタイル */
        .btn {
            flex: 1; /* 4つのボタンを均等幅にする */
            display: block;
            padding: 20px 10px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            box-sizing: border-box;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s ease;
            white-space: nowrap;
        }
        .btn:hover {
            opacity: 0.9;
        }
        /* 青色のリンクボタン */
        .btn-blue {
            background-color: #003399;
            color: #ffffff;
        }
        /* グレーのボタン */
        .btn-gray {
            background-color: #9ea1a6;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="slide-container">
    <div class="main-title">量子生物学</div>
    
    <div class="content-row">
        <div class="side-text">光合成</div>

        <div class="button-group">
            <a href="Quantum_biology_photosynthesis.html" class="btn btn-blue">量子生物学と光合成</a>
            <button class="btn btn-gray"></button>
            <button class="btn btn-gray"></button>
            <button class="btn btn-gray"></button>
        </div>
    </div>
</div>

</body>
</html>
